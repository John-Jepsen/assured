# Insurance AI — multimodal customer service platform (synthetic demo).
# PostgreSQL, explicit migration/bootstrap jobs, the async API, and the React frontend.
# Readiness and successful job completion are dependency-gated without sleep timers.

x-api-runtime: &api-runtime
  image: assured-api:${ASSURED_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: docker/api.Dockerfile
    args:
      INSTALL_SPEECH: "${INSTALL_SPEECH:-false}"
  env_file:
    - path: .env
      required: false
  environment: &api-environment
    INSURANCE_AI_DATABASE_URL: postgresql+asyncpg://insurance:insurance@postgres:5432/insurance_ai
    INSURANCE_AI_SESSION_BACKEND: redis
    INSURANCE_AI_REDIS_URL: redis://:${REDIS_PASSWORD:-insurance-demo}@redis:6379/0
  volumes:
    - modelcache:/models
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance
      POSTGRES_DB: insurance_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance -d insurance_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    user: "999:1000"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-insurance-demo}"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:-insurance-demo}"
    volumes:
      - redisdata:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    <<: *api-runtime
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed-demo:
    <<: *api-runtime
    command: ["python", "-m", "scripts.bootstrap", "--if-empty", "--skip-ingest"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  ingest:
    <<: *api-runtime
    command: ["python", "-m", "scripts.bootstrap", "--if-empty", "--skip-seed"]
    depends_on:
      seed-demo:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *api-runtime
    depends_on:
      ingest:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  pgdata:
  redisdata:
  modelcache:
