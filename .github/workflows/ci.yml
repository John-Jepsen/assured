name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint + tests (unit · API · voice · evals)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check insurance_ai scripts
      - name: Tests (SQLite — includes the eval suite via test_evals.py)
        run: python -m pytest -q

  evaluations:
    name: Evaluations — full suite against Postgres/pgvector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: insurance
          POSTGRES_PASSWORD: insurance
          POSTGRES_DB: insurance_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insurance -d insurance_ai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INSURANCE_AI_DATABASE_URL: postgresql+asyncpg://insurance:insurance@localhost:5432/insurance_ai
      INSURANCE_AI_TEST_DATABASE_URL: postgresql+asyncpg://insurance:insurance@localhost:5432/insurance_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run evaluation suite (38 cases)
        run: python -m insurance_ai.evals.runner
      - name: Verify native pgvector retrieval
        run: python -m pytest -q ../../tests/test_retriever.py

  frontend:
    name: Frontend — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build

  containers:
    name: Containers — build + non-root runtime checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --file docker/api.Dockerfile --tag assured-api:ci .
      - name: Check API runtime
        run: |
          api_user="$(docker image inspect --format '{{.Config.User}}' assured-api:ci)"
          test -n "${api_user}"
          test "${api_user}" != "root"
          test "${api_user}" != "0"
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --entrypoint python assured-api:ci -c \
            "import importlib.util, os; import alembic, insurance_ai, scripts.bootstrap; assert os.getuid() != 0; assert importlib.util.find_spec('pytest') is None; assert importlib.util.find_spec('ruff') is None"
      - name: Build web image
        run: docker build --file docker/web.Dockerfile --tag assured-web:ci .
      - name: Check web runtime
        run: |
          web_user="$(docker image inspect --format '{{.Config.User}}' assured-web:ci)"
          test -n "${web_user}"
          test "${web_user}" != "root"
          test "${web_user}" != "0"
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --add-host api:127.0.0.1 --entrypoint nginx assured-web:ci -t
