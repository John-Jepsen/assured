name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint + tests (unit · API · voice · evals)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify uv.lock is in sync with pyproject.toml (the image build consumes it)
        run: |
          pip install "uv==0.11.6"
          uv lock --check
      - name: Lint (ruff)
        run: ruff check insurance_ai scripts
      - name: Tests (SQLite — includes the eval suite via test_evals.py)
        run: python -m pytest -q

  evaluations:
    name: Evaluations — full suite against Postgres/pgvector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: insurance
          POSTGRES_PASSWORD: insurance
          POSTGRES_DB: insurance_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insurance -d insurance_ai"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      INSURANCE_AI_DATABASE_URL: postgresql+asyncpg://insurance:insurance@localhost:5432/insurance_ai
      INSURANCE_AI_TEST_DATABASE_URL: postgresql+asyncpg://insurance:insurance@localhost:5432/insurance_ai
      INSURANCE_AI_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run evaluation suite (38 cases)
        run: python -m insurance_ai.evals.runner
      - name: Verify native pgvector retrieval and Redis session continuity
        run: python -m pytest -q ../../tests/test_retriever.py ../../tests/test_session_store.py

  frontend:
    name: Frontend — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build

  containers:
    name: Containers — build, hardening, scan + SBOM
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API image
        run: docker build --file docker/api.Dockerfile --tag assured-api:ci .
      - name: Check API runtime
        run: |
          api_user="$(docker image inspect --format '{{.Config.User}}' assured-api:ci)"
          test -n "${api_user}"
          test "${api_user}" != "root"
          test "${api_user}" != "0"
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --entrypoint python assured-api:ci -c \
            "import importlib.util, os; import alembic, insurance_ai, jwt, redis, scripts.bootstrap; assert os.getuid() != 0; assert importlib.util.find_spec('pytest') is None; assert importlib.util.find_spec('ruff') is None"
      - name: Check API console scripts are executable
        # The entrypoint and the migrate job exec these binaries directly, so a
        # broken interpreter shebang must fail here rather than at deploy time.
        run: |
          for script in uvicorn alembic; do
            docker run --rm --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --entrypoint "/opt/venv/bin/${script}" assured-api:ci --version
          done
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            assured-api:ci uvicorn --version
      - name: Build web image
        run: docker build --file docker/web.Dockerfile --tag assured-web:ci .
      - name: Check web runtime
        run: |
          web_user="$(docker image inspect --format '{{.Config.User}}' assured-web:ci)"
          test -n "${web_user}"
          test "${web_user}" != "root"
          test "${web_user}" != "0"
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --add-host api:127.0.0.1 --entrypoint nginx assured-web:ci -t
      - name: Block fixable critical image vulnerabilities
        run: |
          docker volume create trivy-cache
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy \
            "${TRIVY_IMAGE}" image --skip-version-check --ignore-unfixed \
            --scanners vuln --severity CRITICAL --exit-code 1 assured-api:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy \
            "${TRIVY_IMAGE}" image --skip-version-check --ignore-unfixed \
            --scanners vuln --severity CRITICAL --exit-code 1 assured-web:ci
      - name: Generate SPDX SBOMs
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy \
            -v "${PWD}/sbom:/sbom" "${TRIVY_IMAGE}" image --skip-version-check \
            --format spdx-json --output /sbom/assured-api.spdx.json assured-api:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy \
            -v "${PWD}/sbom:/sbom" "${TRIVY_IMAGE}" image --skip-version-check \
            --format spdx-json --output /sbom/assured-web.spdx.json assured-web:ci
      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assured-spdx-sboms
          path: sbom/*.spdx.json
          if-no-files-found: error
