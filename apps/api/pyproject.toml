[project]
name = "assured"
version = "0.1.0"
description = "Assured — Multimodal Voice-to-Voice Insurance AI (synthetic demo)"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pydantic-ai-slim>=0.0.20",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "numpy>=1.26",
    "pgvector>=0.3",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Real model adapters — installed per hardware profile, not required for the
# deterministic core / tests.
speech = ["faster-whisper>=1.0", "piper-tts>=1.2", "soundfile>=0.12"]
stripe = ["stripe>=9.0"]
telephony = ["twilio>=9.0"]
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "pyyaml>=6.0", "alembic>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["insurance_ai*"]
